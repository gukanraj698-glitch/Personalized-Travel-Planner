name: Wanderly Travel OS CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & TypeScript Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            server/package.json
            client/package.json

      - name: Install & Build Server
        run: |
          cd server
          npm install
          npm run build

      - name: Install & Build Client
        run: |
          cd client
          npm install
          npm run build
