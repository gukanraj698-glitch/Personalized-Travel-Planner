services:
  - type: web
    name: wanderly-travel-planner
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wanderly-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: wanderly-db
    databaseName: wanderly
    user: postgres
    plan: free
